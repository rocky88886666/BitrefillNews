name: Telegram News Push

on:
  schedule:
    # GitHub Actions enforces a 5-minute minimum; * * * * * will not run.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      stability_test:
        description: Run bot every minute inside one job (stability test)
        type: boolean
        default: false
      stability_test_minutes:
        description: Minutes to keep running when stability_test is true
        type: number
        default: 30
      backfill_history:
        description: Push historical news in batches (90 days)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill historical news
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_history
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          POST_LIMIT: ${{ vars.POST_LIMIT }}
          MAX_AGE_DAYS: "90"
          BACKFILL: "1"
        run: python bitrefill_news_bot.py --backfill

      - name: Stability test (every minute)
        if: github.event_name == 'workflow_dispatch' && inputs.stability_test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          POST_LIMIT: ${{ vars.POST_LIMIT }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS }}
          SEND_STATUS_WHEN_EMPTY: "1"
        run: |
          minutes="${{ inputs.stability_test_minutes }}"
          for i in $(seq 1 "$minutes"); do
            echo "=== Stability run $i/$minutes at $(date -u) ==="
            python bitrefill_news_bot.py || true
            if [ "$i" -lt "$minutes" ]; then
              sleep 60
            fi
          done

      - name: Send Telegram post
        if: github.event_name != 'workflow_dispatch' || (!inputs.stability_test && !inputs.backfill_history)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          POST_LIMIT: ${{ vars.POST_LIMIT }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS }}
          SEND_STATUS_WHEN_EMPTY: "1"
        run: python bitrefill_news_bot.py

      - name: Commit sent-link cache
        run: |
          if [ -n "$(git status --porcelain data/sent.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sent.json
            git commit -m "Update sent news cache"
            git push
          fi
