name: Daily Telegram Push

on:
  schedule:
    # 09:30 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          POST_LIMIT: ${{ vars.POST_LIMIT }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS }}
        run: python bitrefill_news_bot.py

      - name: Commit sent-link cache
        run: |
          if [ -n "$(git status --porcelain data/sent.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sent.json
            git commit -m "Update sent news cache"
            git push
          fi
